name: Tag verified v1.3.0 release
on:
  workflow_run:
    workflows: ["Verify portable transit MCP"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
jobs:
  publish-tag:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Create only the verified v1.3.0 tag
        run: |
          test "$(node -p "require('./package.json').version")" = "1.3.0"
          if git show-ref --tags --verify --quiet refs/tags/v1.3.0; then
            if test "$(git rev-parse refs/tags/v1.3.0^{})" = "$(git rev-parse HEAD)"; then
              echo "v1.3.0 already points to this commit"
            else
              echo "v1.3.0 exists at a different commit; refusing to move tag"
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v1.3.0 -m "Verified transit MCP v1.3.0"
            git push origin refs/tags/v1.3.0
          fi